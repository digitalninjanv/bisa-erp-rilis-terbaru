<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <title>Koneksi Server — Bisa POS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f5f2;
      color: #1c1917;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #d6d3d1;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 14px; font-size: 15px; line-height: 1.55; color: #44403c; }
    .url-box {
      padding: 10px 12px;
      border-radius: 8px;
      background: #f5f5f4;
      border: 1px solid #e7e5e4;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 18px;
    }
    .actions { display: grid; gap: 10px; }
    button {
      min-height: 48px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 16px;
      border: 1px solid #d6d3d1;
      background: #fff;
      color: #1c1917;
    }
    button:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }
    button.primary { background: #0f766e; border-color: #0f766e; color: #fff; }
    button.primary:hover { background: #0d5e58; }
    button:hover { background: #f5f5f4; }
  </style>
</head>
<body>
  <main role="alertdialog" aria-labelledby="errTitle" aria-describedby="errDesc">
    <span class="badge">Server Belum Terhubung</span>
    <h1 id="errTitle">Bisa ERP belum dapat dijangkau</h1>
    <p id="errDesc">Pastikan layanan Bisa ERP sudah aktif atau alamat jaringan toko sudah benar, lalu coba sambungkan kembali.</p>
    <div id="originLabel" class="url-box">Memeriksa alamat server…</div>
    <div class="actions">
      <button type="button" id="retryBtn" class="primary" autofocus>Coba Sambung Ulang</button>
      <button type="button" id="settingsBtn">Ubah Alamat Server / Atur Printer</button>
    </div>
  </main>
  <script src="./offline-view.js"></script>
</body>
</html>
