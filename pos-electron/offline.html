<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <title>Koneksi Server — Bisa POS</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e7ddcc;
      --panel: #fffdf8;
      --tray: #f4ecdd;
      --ink: #1c1917;
      --muted: #4f4a42;
      --border: #6f6658;
      --line: #d3c8b6;
      --primary: #047857;
      --primary-deep: #065f46;
      --primary-fg: #ffffff;
      --soft: #e6f3ed;
      --amber: #92400e;
      --amber-bg: #fef3c7;
      --amber-line: #fcd34d;
      --focus: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }
    .shell { width: 100%; max-width: 480px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--ink);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-deep);
      color: #fde68a;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .brand-name { display: block; font-size: 14px; font-weight: 700; line-height: 1.2; }
    .brand-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    main {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 12px 30px rgb(28 25 23 / 0.10);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--amber-line);
      border-radius: 999px;
      background: var(--amber-bg);
      color: var(--amber);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--amber);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .url-box {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--tray);
      color: var(--ink);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      word-break: break-all;
      margin-bottom: 18px;
    }
    .actions { display: grid; gap: 10px; }
    button {
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    button:hover { background: var(--tray); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }
    button.primary:hover { background: var(--primary-deep); border-color: var(--primary-deep); }
    button.primary:focus-visible { outline-color: #f3b63f; }
    .footnote {
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    @media (max-width: 420px) {
      body { padding: 16px; }
      main { padding: 20px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand" aria-label="Bisa POS">
      <span class="brand-mark" aria-hidden="true">b</span>
      <span>
        <span class="brand-name">Bisa POS</span>
        <span class="brand-sub">Terminal Desktop</span>
      </span>
    </header>

    <main role="alertdialog" aria-labelledby="errTitle" aria-describedby="errDesc">
      <span class="badge">Server belum terhubung</span>
      <h1 id="errTitle">Bisa ERP belum dapat dijangkau</h1>
      <p id="errDesc">Pastikan layanan Bisa ERP sudah aktif atau alamat jaringan toko sudah benar, lalu sambungkan kembali.</p>
      <div id="originLabel" class="url-box">Memeriksa alamat server…</div>
      <div class="actions">
        <button type="button" id="retryBtn" class="primary" autofocus>Coba Sambung Ulang</button>
        <button type="button" id="settingsBtn">Ubah Alamat Server / Atur Printer</button>
      </div>
    </main>

    <p class="footnote">Transaksi offline tetap tersimpan dan disinkronkan saat server kembali.</p>
  </div>
  <script src="./offline-view.js"></script>
</body>
</html>
